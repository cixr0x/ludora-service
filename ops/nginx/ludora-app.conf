root /opt/ludora/ludora-ui/dist;
index index.html;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /index.html {
    return 301 /;
}

location = /game {
    return 302 /;
}

location = /game/ {
    return 302 /;
}

location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ~ ^/game/([0-9]+)/?$ {
    rewrite ^/game/([0-9]+)/?$ /api/items/$1/canonical-route break;
    proxy_pass http://127.0.0.1:4000;
    proxy_intercept_errors on;
    error_page 404 = @invalid_game_redirect;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^(/game/[0-9]+/[^/]+)/$ {
    return 301 $1;
}

location ~ ^/game/[0-9]+/[^/]+$ {
    error_page 404 = @invalid_game_redirect;
    try_files $uri.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /game/ {
    return 302 /;
}

location @invalid_game_redirect {
    return 302 /;
}

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/(?:ludoradar-icon\.webp|bgg-primary-logo-reverse\.svg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /search {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, follow" always;
}

location ~ ^/browse/[^/]+/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, follow" always;
}

location = /privacidad {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, follow" always;
}

location = /terminos {
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, follow" always;
}

location / {
    return 404;
}
